<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Grades · Escola Instructiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#FAF7F2;--branco:#FFFFFF;--tinta:#16130F;--tinta-2:#5F584E;--tinta-3:#8E867A;
  --linha:#E8E1D6;--laranja:#F26522;--verde:#25A06B;
  --zap-fundo:#ECE5DD;--zap-balao:#DCF8C6;--raio:12px;--rail:308px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--papel);color:var(--tinta);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit}

header{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:14px 22px;background:var(--branco);border-bottom:1px solid var(--linha);
}
.barra-grad{height:3px;width:34px;background:linear-gradient(90deg,var(--laranja),var(--verde));border-radius:2px}
.marca b{font-family:'Anton',sans-serif;font-size:19px;letter-spacing:.5px;text-transform:uppercase}
.marca span{font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--tinta-3);margin-left:8px}
.link-admin{margin-left:auto;font-size:12px;font-weight:700;color:var(--tinta-2);text-decoration:none;border:1px solid var(--linha);padding:7px 13px;border-radius:99px}
.link-admin:hover{border-color:var(--tinta);color:var(--tinta)}

.app{display:grid;grid-template-columns:var(--rail) 1fr;height:calc(100vh - 59px);overflow:hidden}
.rail{border-right:1px solid var(--linha);background:var(--branco);display:flex;flex-direction:column;min-height:0}
.busca{padding:16px 16px 12px;border-bottom:1px solid var(--linha)}
.busca input{width:100%;padding:11px 13px;border:1px solid var(--linha);border-radius:9px;font-size:14px;background:var(--papel);outline:none}
.busca input:focus{border-color:var(--tinta);background:var(--branco)}
.busca p{margin-top:9px;font-size:11px;color:var(--tinta-3);font-weight:600}
.lista{overflow-y:auto;padding:8px;flex:1}
.item{width:100%;text-align:left;padding:12px 13px;border-radius:10px;display:block;border:1px solid transparent;margin-bottom:2px}
.item:hover{background:var(--papel)}
.item.ativo{background:rgba(22,19,15,.05);border-color:var(--linha)}
.item strong{display:block;font-size:14px;font-weight:700;line-height:1.3}
.item small{display:block;margin-top:3px;font-size:11.5px;color:var(--tinta-3);font-weight:600}
.item.ativo::after{content:'';display:block;height:3px;width:38px;margin-top:9px;border-radius:2px;background:linear-gradient(90deg,var(--laranja),var(--verde))}

.painel{display:grid;grid-template-columns:1fr 404px;overflow:hidden;min-height:0}
.grade{padding:34px 38px 70px;overflow-y:auto;min-height:0}
.titulo-curso{font-family:'Anton',sans-serif;font-size:38px;line-height:1.03;text-transform:uppercase;letter-spacing:.4px;max-width:22ch}
.subtitulo{margin-top:10px;font-size:16px;color:var(--tinta-2);font-weight:600;max-width:60ch}
.fichas{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.ficha{border:1px solid var(--linha);background:var(--branco);border-radius:99px;padding:7px 13px;font-size:12px;font-weight:700;color:var(--tinta-2)}
.ficha b{color:var(--tinta)}
.ficha.destaque{border-color:transparent;background:linear-gradient(90deg,var(--laranja),var(--verde));color:#fff}
.ficha.destaque b{color:#fff}
.texto{margin-top:20px;font-size:14.5px;line-height:1.7;color:var(--tinta-2);max-width:72ch;white-space:pre-wrap}

.rotulo{font-size:11px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:var(--tinta-3);margin:36px 0 14px;display:flex;align-items:center;gap:10px}
.rotulo::after{content:'';flex:1;height:1px;background:var(--linha)}
.rotulo button{font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--tinta-3);border:1px solid var(--linha);border-radius:99px;padding:5px 11px;background:var(--branco)}
.rotulo button:hover{color:var(--tinta);border-color:var(--tinta)}
.rotulo button{order:2}
.rotulo::after{order:1}

.destaques{display:grid;gap:8px;max-width:74ch}
.destaques li{list-style:none;position:relative;padding-left:22px;font-size:14px;line-height:1.6;color:var(--tinta-2)}
.destaques li::before{content:'';position:absolute;left:0;top:8px;width:9px;height:9px;border-radius:2px;background:linear-gradient(135deg,var(--laranja),var(--verde))}

.parte{
  display:flex;align-items:center;gap:10px;margin:22px 0 10px;
  font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--laranja);
}
.parte::after{content:'';flex:1;height:1px;background:var(--linha)}

.modulo{border:1px solid var(--linha);background:var(--branco);border-radius:var(--raio);margin-bottom:9px;overflow:hidden}
.modulo-topo{display:flex;align-items:flex-start;gap:13px;padding:15px;width:100%;text-align:left}
.num{font-family:'Anton',sans-serif;font-size:15px;color:var(--laranja);min-width:34px;padding-top:1px;letter-spacing:.5px}
.modulo-topo h3{font-size:15px;font-weight:700;flex:1;line-height:1.35}
.modulo-topo .meta{font-size:11px;font-weight:700;color:var(--tinta-3);white-space:nowrap;padding-top:2px}
.copiar-mod{font-size:11px;font-weight:700;color:var(--tinta-3);border:1px solid var(--linha);border-radius:7px;padding:5px 9px;white-space:nowrap}
.copiar-mod:hover{color:var(--verde);border-color:var(--verde)}
.corpo{padding:0 15px 16px 62px;display:none}
.modulo.aberto .corpo{display:block}
.corpo .resumo{font-size:13.5px;line-height:1.65;color:var(--tinta-2);padding-bottom:12px}
.sub{font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--tinta-3);margin:12px 0 7px}
.corpo ul{margin:0}
.corpo li{list-style:none;font-size:13.5px;line-height:1.55;color:var(--tinta-2);padding:5px 0 5px 16px;position:relative}
.corpo li::before{content:'';position:absolute;left:0;top:13px;width:5px;height:5px;border-radius:99px;background:var(--verde)}
.corpo ul.aprende li::before{background:var(--laranja);border-radius:1px}
.dif{margin-top:12px;padding:11px 13px;background:var(--papel);border-radius:9px;font-size:13px;line-height:1.6;color:var(--tinta-2);border-left:3px solid var(--verde)}

.livro{border:1px solid var(--linha);background:var(--branco);border-radius:var(--raio);padding:15px 17px;margin-bottom:8px;display:flex;gap:14px}
.livro .selo{font-family:'Anton',sans-serif;font-size:13px;color:var(--verde);min-width:24px}
.livro h4{font-size:14px;font-weight:700;line-height:1.4}
.livro .isbn{margin-top:5px;font-size:11.5px;font-weight:700;color:var(--tinta-3);letter-spacing:.3px}
.livro p{margin-top:8px;font-size:13px;line-height:1.6;color:var(--tinta-2)}

/* coluna de cópia */
.copia{border-left:1px solid var(--linha);background:var(--branco);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.copia-topo{padding:18px 20px 14px;border-bottom:1px solid var(--linha)}
.copia-topo h4{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--tinta-3)}
.formatos{display:flex;gap:5px;margin-top:12px;background:var(--papel);padding:4px;border-radius:9px}
.formatos button{flex:1;padding:8px 4px;font-size:11.5px;font-weight:700;color:var(--tinta-2);border-radius:6px}
.formatos button.ativo{background:var(--branco);color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.09)}
.opcoes{display:flex;flex-wrap:wrap;gap:14px;margin-top:13px}
.opcao{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--tinta-2);cursor:pointer}
.opcao input{accent-color:var(--verde);width:15px;height:15px}
.previa{flex:1;overflow-y:auto;background:var(--zap-fundo);padding:18px}
.balao{background:var(--zap-balao);border-radius:10px 10px 10px 3px;padding:13px 15px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.12);color:#101c14}
.balao b{font-weight:800}
.balao i{font-style:italic;color:#3a4a3e}
.hora{display:block;text-align:right;font-size:10px;color:#5c6b5f;margin-top:6px;font-weight:600}
.copia-rodape{padding:14px 20px 18px;border-top:1px solid var(--linha)}
.aviso{font-size:11.5px;font-weight:700;color:var(--tinta-2);background:var(--papel);border-radius:8px;padding:9px 11px;margin-bottom:10px;line-height:1.45}
.partes-copia{display:grid;gap:6px;margin-bottom:11px}
.partes-copia button{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  border:1px solid var(--linha);border-radius:8px;padding:9px 12px;font-size:12px;font-weight:700;color:var(--tinta-2);
}
.partes-copia button:hover{border-color:var(--verde);color:var(--verde)}
.partes-copia span{font-weight:600;color:var(--tinta-3);font-size:11px}
.btn-copiar{width:100%;padding:15px;border-radius:10px;color:#fff;font-size:14.5px;font-weight:800;background:linear-gradient(90deg,var(--laranja),var(--verde));letter-spacing:.3px}
.btn-copiar:hover{filter:brightness(1.06)}
.btn-copiar:active{transform:translateY(1px)}
.contagem{margin-top:9px;font-size:11px;color:var(--tinta-3);font-weight:600;text-align:center}

.vazio{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 30px;gap:12px}
.vazio h2{font-family:'Anton',sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:.5px}
.vazio p{font-size:14px;color:var(--tinta-2);max-width:44ch;line-height:1.6}
.vazio a{margin-top:6px;padding:12px 22px;border-radius:10px;color:#fff;background:linear-gradient(90deg,var(--laranja),var(--verde));font-weight:800;font-size:14px;text-decoration:none}
#toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:var(--tinta);color:#fff;padding:12px 22px;border-radius:99px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.22s;z-index:60}
#toast.ver{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){
  .app{height:auto;overflow:visible}
  .painel{grid-template-columns:1fr;overflow:visible}
  .grade{overflow:visible}
  .copia{border-left:0;border-bottom:1px solid var(--linha);border-top:0;max-height:none;order:-1}
  .previa{max-height:52vh}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--linha)}
  .lista{max-height:32vh}
  .grade{padding:24px 20px 40px}
  .titulo-curso{font-size:27px}
  .corpo{padding-left:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}
</style>
</head>
<body>

<header>
  <div class="barra-grad"></div>
  <div class="marca"><b>Central de Grades</b><span>Escola Instructiva</span></div>
  <a class="link-admin" href="/admin.html">Gerenciar cursos</a>
</header>

<div class="app">
  <aside class="rail">
    <div class="busca">
      <input id="busca" type="search" placeholder="Buscar curso ou assunto…" autocomplete="off">
      <p id="contador">Carregando…</p>
    </div>
    <nav class="lista" id="lista"></nav>
  </aside>
  <main class="painel" id="painel"></main>
</div>

<div id="toast"></div>

<script>
const LIMITE_ZAP = 3400;      // margem segura abaixo dos 4.096 do WhatsApp
let cursos = [], atual = null, formato = 'completa';
let comDescricoes = false, semAsteriscos = false;

const $ = (s) => document.querySelector(s);
const lista = document.getElementById('lista');
const painel = document.getElementById('painel');

/* ---------- carregar ---------- */
async function carregar(){
  try{
    cursos = await (await fetch('/api/grades')).json();
  }catch(e){
    $('#contador').textContent = 'Não foi possível carregar os cursos. Atualize a página.';
    return;
  }
  desenharLista();
  cursos.length ? selecionar(cursos[0].id) : desenharVazio();
}

function totais(c){
  const mods = (c.modulos||[]).length;
  const aulas = (c.modulos||[]).reduce((t,m)=>t+(m.aulas?.length||0),0);
  return { mods, aulas };
}

function desenharLista(){
  const termo = ($('#busca').value||'').toLowerCase().trim();
  const filtrados = cursos.filter(c => {
    if(!termo) return true;
    const blob = [c.nome,c.subtitulo,c.descricao,c.objetivo,
      ...(c.destaques||[]),
      ...(c.livros||[]).map(l=>l.titulo),
      ...(c.modulos||[]).flatMap(m => [m.titulo,m.descricao,...(m.aulas||[]),...(m.aprende||[])])
    ].join(' ').toLowerCase();
    return blob.includes(termo);
  });

  $('#contador').textContent = cursos.length === 0 ? 'Nenhum curso cadastrado'
    : `${filtrados.length} de ${cursos.length} curso${cursos.length>1?'s':''}`;

  lista.innerHTML = filtrados.map(c => {
    const { mods, aulas } = totais(c);
    const p = [];
    if(mods) p.push(`${mods} módulos`);
    if(aulas) p.push(`${aulas} tópicos`);
    if(c.cargaHoraria) p.push(c.cargaHoraria);
    return `<button class="item ${atual===c.id?'ativo':''}" data-id="${c.id}">
      <strong>${esc(c.nome)}</strong><small>${esc(p.join(' · ')||'Sem grade ainda')}</small></button>`;
  }).join('') || '<p style="padding:16px;font-size:13px;color:var(--tinta-3)">Nada encontrado com esse termo.</p>';

  lista.querySelectorAll('.item').forEach(b => b.onclick = () => selecionar(b.dataset.id));
}

function desenharVazio(){
  painel.innerHTML = `<div class="vazio"><h2>Nenhuma grade cadastrada</h2>
    <p>Cadastre o primeiro curso no painel de gestão. Depois é só selecionar aqui, escolher o formato e copiar.</p>
    <a href="/admin.html">Cadastrar primeiro curso</a></div>`;
}

function selecionar(id){
  atual = id;
  const c = cursos.find(x => x.id === id);
  if(!c) return;
  desenharLista();
  desenharCurso(c);
  document.querySelector('.grade')?.scrollTo(0,0);
}

/* ---------- numeração ---------- */
const ROMANOS = ['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV',
  'XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV'];
function numero(c, i){
  return c.numeracao === 'romana' ? (ROMANOS[i+1] || String(i+1)) : String(i+1).padStart(2,'0');
}

/* ---------- tela do curso ---------- */
function desenharCurso(c){
  const { mods, aulas } = totais(c);
  const fichas = [
    c.cargaHoraria && ['Carga horária', c.cargaHoraria, true],
    mods && ['Módulos', mods],
    aulas && ['Tópicos', aulas],
    c.nivel && ['Nível', c.nivel],
    c.modalidade && ['Modalidade', c.modalidade],
    c.certificado && ['Certificado', c.certificado]
  ].filter(Boolean);

  let parteAtual = null;
  const modulosHTML = (c.modulos||[]).map((m,i) => {
    let cabeca = '';
    if(m.parte && m.parte !== parteAtual){ parteAtual = m.parte; cabeca = `<div class="parte">${esc(m.parte)}</div>`; }
    return cabeca + moduloHTML(c, m, i);
  }).join('');

  painel.innerHTML = `
    <section class="grade">
      <h1 class="titulo-curso">${esc(c.nome)}</h1>
      ${c.subtitulo ? `<p class="subtitulo">${esc(c.subtitulo)}</p>` : ''}
      ${fichas.length ? `<div class="fichas">${fichas.map(([k,v,d])=>
        `<span class="ficha ${d?'destaque':''}">${k}: <b>${esc(v)}</b></span>`).join('')}</div>` : ''}
      ${c.descricao ? `<p class="texto">${esc(c.descricao)}</p>` : ''}

      ${(c.destaques||[]).length ? `<div class="rotulo">Diferenciais</div>
        <ul class="destaques">${c.destaques.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>` : ''}

      ${mods ? `<div class="rotulo">Grade curricular
        <button id="alternar-tudo">Expandir tudo</button></div>${modulosHTML}` : ''}

      ${(c.livros||[]).length ? `<div class="rotulo">Obras do professor conteudista
        <button id="copiar-livros">Copiar lista</button></div>
        ${c.livros.map((l,i)=>`<div class="livro">
          <span class="selo">${String(i+1).padStart(2,'0')}</span>
          <div><h4>${esc(l.titulo)}</h4>
          <p class="isbn">${[l.edicao,l.isbn&&('ISBN '+l.isbn)].filter(Boolean).map(esc).join(' · ')}</p>
          ${l.aplicacao?`<p>${esc(l.aplicacao)}</p>`:''}</div></div>`).join('')}` : ''}

      ${(c.bonus||[]).length ? `<div class="rotulo">Bônus</div>
        <ul class="destaques">${c.bonus.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>` : ''}

      ${c.objetivo ? `<div class="rotulo">Objetivo geral</div><p class="texto" style="margin-top:0">${esc(c.objetivo)}</p>` : ''}
      ${c.observacoes ? `<div class="rotulo">Observações</div><p class="texto" style="margin-top:0">${esc(c.observacoes)}</p>` : ''}
    </section>

    <aside class="copia">
      <div class="copia-topo">
        <h4>Texto pronto pra enviar</h4>
        <div class="formatos">
          <button data-f="completa" class="${formato==='completa'?'ativo':''}">Completa</button>
          <button data-f="modulos" class="${formato==='modulos'?'ativo':''}">Só módulos</button>
          <button data-f="resumo" class="${formato==='resumo'?'ativo':''}">Resumo</button>
        </div>
        <div class="opcoes">
          <label class="opcao"><input type="checkbox" id="op-desc" ${comDescricoes?'checked':''}> Com descrição dos módulos</label>
          <label class="opcao"><input type="checkbox" id="op-ast" ${semAsteriscos?'checked':''}> Sem asteriscos</label>
        </div>
      </div>
      <div class="previa"><div class="balao" id="balao"></div></div>
      <div class="copia-rodape" id="rodape"></div>
    </aside>`;

  painel.querySelectorAll('.modulo-topo').forEach(t =>
    t.onclick = (e) => { if(!e.target.closest('.copiar-mod')) t.parentElement.classList.toggle('aberto'); });
  painel.querySelectorAll('.copiar-mod').forEach(b =>
    b.onclick = () => copiar(textoModulo(c, c.modulos[+b.dataset.i], +b.dataset.i, true), 'Módulo copiado'));
  painel.querySelectorAll('.formatos button').forEach(b =>
    b.onclick = () => { formato = b.dataset.f; desenharCurso(c); });
  $('#op-desc').onchange = (e) => { comDescricoes = e.target.checked; atualizarPrevia(c); };
  $('#op-ast').onchange  = (e) => { semAsteriscos = e.target.checked; atualizarPrevia(c); };

  const alternar = $('#alternar-tudo');
  if(alternar) alternar.onclick = () => {
    const abrir = alternar.textContent === 'Expandir tudo';
    painel.querySelectorAll('.modulo').forEach(m => m.classList.toggle('aberto', abrir));
    alternar.textContent = abrir ? 'Recolher tudo' : 'Expandir tudo';
  };
  const btnLivros = $('#copiar-livros');
  if(btnLivros) btnLivros.onclick = (e) => { e.stopPropagation(); copiar(textoLivros(c), 'Lista de livros copiada'); };

  atualizarPrevia(c);
}

function moduloHTML(c, m, i){
  return `<div class="modulo ${i===0?'aberto':''}">
    <button class="modulo-topo">
      <span class="num">${numero(c,i)}</span>
      <h3>${esc(m.titulo || 'Sem título')}</h3>
      ${m.cargaHoraria ? `<span class="meta">${esc(m.cargaHoraria)}</span>` : ''}
      <span class="copiar-mod" data-i="${i}">Copiar</span>
    </button>
    <div class="corpo">
      ${m.descricao ? `<p class="resumo">${esc(m.descricao)}</p>` : ''}
      ${(m.aulas||[]).length ? `<p class="sub">Conteúdos abordados</p>
        <ul>${m.aulas.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>` : ''}
      ${(m.aprende||[]).length ? `<p class="sub">O participante vai aprender a</p>
        <ul class="aprende">${m.aprende.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>` : ''}
      ${m.diferencial ? `<p class="dif">${esc(m.diferencial)}</p>` : ''}
    </div></div>`;
}

/* ---------- montagem do texto ---------- */
function neg(t){ return semAsteriscos ? t : `*${t}*`; }
function ital(t){ return semAsteriscos ? t : `_${t}_`; }

function cabecalho(c){
  const L = [neg(c.nome.toUpperCase())];
  if(c.subtitulo) L.push(ital(c.subtitulo));
  L.push('');
  const meta = [];
  if(c.cargaHoraria) meta.push(`⏱ Carga horária: ${c.cargaHoraria}`);
  if((c.modulos||[]).length) meta.push(`📚 ${c.modulos.length} módulos`);
  if(c.nivel) meta.push(`🎯 Nível: ${c.nivel}`);
  if(c.modalidade) meta.push(`💻 Modalidade: ${c.modalidade}`);
  if(c.certificado) meta.push(`📜 Certificado: ${c.certificado}`);
  if(meta.length) L.push(meta.join('\n'), '');
  if(c.descricao) L.push(c.descricao, '');
  return L.join('\n').trim();
}

function textoModulo(c, m, i, detalhado){
  const L = [neg(`Módulo ${numero(c,i)} — ${m.titulo}${m.cargaHoraria?` (${m.cargaHoraria})`:''}`)];
  if((detalhado || comDescricoes) && m.descricao) L.push(m.descricao);
  (m.aulas||[]).forEach(a => L.push(`• ${a}`));
  if(detalhado && (m.aprende||[]).length){
    L.push('', ital('O participante vai aprender a:'));
    m.aprende.forEach(a => L.push(`✔ ${a.replace(/;$/,'')}`));
  }
  if(detalhado && m.diferencial) L.push('', m.diferencial);
  return L.join('\n');
}

function textoLivros(c){
  const L = [neg('OBRAS DO PROFESSOR CONTEUDISTA')];
  (c.livros||[]).forEach(l => {
    L.push(`📘 ${l.titulo}`);
    const ficha = [l.edicao, l.isbn && ('ISBN ' + l.isbn)].filter(Boolean).join(' · ');
    if(ficha) L.push(ficha);
    L.push('');
  });
  return L.join('\n').trim();
}

// devolve um array de blocos; cada bloco vira uma parte da mensagem se o texto for longo
function blocos(c){
  const B = [];
  if(formato === 'resumo'){
    const L = [cabecalho(c)];
    const { mods, aulas } = totais(c);
    const n = [];
    if(mods) n.push(`${mods} módulos`);
    if(aulas) n.push(`${aulas} tópicos`);
    if(n.length) L.push('', `📚 ${n.join(' · ')}`);
    if((c.destaques||[]).length) L.push('', ...c.destaques.slice(0,3).map(d=>`✔ ${d}`));
    L.push('', 'Quer que eu te mande a grade completa, com todos os módulos?');
    return [L.join('\n')];
  }

  B.push(cabecalho(c));

  if((c.destaques||[]).length && formato === 'completa'){
    B.push([neg('DIFERENCIAIS'), ...c.destaques.map(d=>`✔ ${d}`)].join('\n'));
  }

  if((c.modulos||[]).length){
    let parte = null;
    let buf = [neg('GRADE CURRICULAR')];
    c.modulos.forEach((m,i) => {
      if(m.parte && m.parte !== parte){
        parte = m.parte;
        buf.push('', ital(m.parte));
      }
      const t = formato === 'modulos'
        ? neg(`Módulo ${numero(c,i)} — ${m.titulo}${m.cargaHoraria?` (${m.cargaHoraria})`:''}`)
        : textoModulo(c, m, i, false);
      buf.push('', t);
      if(formato === 'completa'){ B.push(buf.join('\n').trim()); buf = []; }
    });
    if(buf.length) B.push(buf.join('\n').trim());
  }

  if((c.livros||[]).length && formato === 'completa') B.push(textoLivros(c));
  if((c.bonus||[]).length) B.push([neg('BÔNUS'), ...c.bonus.map(b=>`🎁 ${b}`)].join('\n'));

  const fim = [];
  if(c.observacoes) fim.push(c.observacoes);
  fim.push('Escola Instructiva');
  B.push(fim.join('\n\n'));

  return B.filter(b => b && b.trim());
}

function textoCompleto(c){ return blocos(c).join('\n\n').replace(/\n{3,}/g,'\n\n').trim(); }

// junta os blocos em mensagens de até LIMITE_ZAP caracteres
function partes(c){
  const B = blocos(c);
  const P = [];
  let buffer = '';
  B.forEach(b => {
    if(!buffer){ buffer = b; return; }
    if((buffer + '\n\n' + b).length <= LIMITE_ZAP) buffer += '\n\n' + b;
    else { P.push(buffer); buffer = b; }
  });
  if(buffer) P.push(buffer);
  if(P.length > 1){
    const marca = (i) => semAsteriscos ? `(${i+1}/${P.length})` : `*(${i+1}/${P.length})*`;
    return P.map((p,i) => i === 0 ? p : `${marca(i)}\n\n${p}`);
  }
  return P;
}

function atualizarPrevia(c){
  const txt = textoCompleto(c);
  const hora = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  $('#balao').innerHTML = esc(txt)
    .replace(/\*(.+?)\*/g,'<b>$1</b>')
    .replace(/_(.+?)_/g,'<i>$1</i>') + `<span class="hora">${hora}</span>`;

  const ps = partes(c);
  const nome = formato==='completa'?'grade completa':formato==='modulos'?'só módulos':'resumo';
  $('#rodape').innerHTML = `
    ${ps.length > 1 ? `<p class="aviso">Texto longo: o WhatsApp corta em 4.096 caracteres.
      Mande em ${ps.length} mensagens, na ordem.</p>
      <div class="partes-copia">${ps.map((p,i)=>
        `<button data-p="${i}">Copiar parte ${i+1} de ${ps.length} <span>${p.length} caract.</span></button>`).join('')}</div>` : ''}
    <button class="btn-copiar" id="btn-copiar">${ps.length>1?'Copiar tudo de uma vez':'Copiar texto'}</button>
    <p class="contagem">${txt.length} caracteres · formato ${nome}</p>`;

  $('#btn-copiar').onclick = () => copiar(txt, 'Texto copiado');
  $('#rodape').querySelectorAll('[data-p]').forEach(b =>
    b.onclick = () => copiar(ps[+b.dataset.p], `Parte ${+b.dataset.p+1} copiada`));
}

/* ---------- utilidades ---------- */
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

async function copiar(texto, msg){
  try{ await navigator.clipboard.writeText(texto); }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast(msg);
}

let tt;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('ver');
  clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('ver'), 1800);
}

$('#busca').addEventListener('input', desenharLista);
document.addEventListener('keydown', (e) => {
  if(e.key === '/' && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); $('#busca').focus(); }
});

carregar();
